# =============================================================================
# GROUNDWATER QUALITY FORECASTING FRAMEWORK - MAIN CONFIGURATION
# Target: Journal of Environmental Management (JEM)
# =============================================================================

# -----------------------------------------------------------------------------
# DATA PATHS
# -----------------------------------------------------------------------------
data:
  base_dir: "/home/mohsen/data/archive"

  # base_dir: "/Users/mohsenasghariilani/Downloads/archive"
  files:
    2018: "ground_water_quality_2018_post.csv"
    2019: "ground_water_quality_2019_post.csv"
    2020: "ground_water_quality_2020_post.csv"

  # External climate dataset (ERA5-Land): merged in by year + nearest grid
  # cell to each well's lat_gis/long_gis. Provides total precipitation
  # (annual/monsoon/pre-monsoon) and volumetric soil water layer-1
  # (annual/monsoon/pre-monsoon) — see src/data/era5_loader.py.
  external:
    era5_nc_path: "/home/mohsen/data/era5/telangana_era5_land_2018_2020.nc"

  # Location matching for transitions
  location_keys:
    - district
    - mandal
    - village
    - lat_gis
    - long_gis

# -----------------------------------------------------------------------------
# OUTPUT PATHS
# -----------------------------------------------------------------------------
output:
  base_dir: "outputs"
  paper_outputs: "outputs/paper_outputs"
  figures: "outputs/paper_outputs/figures"
  tables: "outputs/paper_outputs/tables"
  models: "outputs/models"
  logs: "outputs/logs"
  checkpoints: "outputs/checkpoints"

# -----------------------------------------------------------------------------
# DATA QUALITY SETTINGS
# -----------------------------------------------------------------------------
data_quality:
  # Schema expectations
  expected_columns:
    - sno
    - district
    - mandal
    - village
    - lat_gis
    - long_gis
    - gwl
    - season
    - pH
    - EC
    - TDS
    - CO3
    - HCO3
    - Cl
    - F
    - NO3
    - SO4
    - Na
    - K
    - Ca
    - Mg
    - TH
    - SAR
    - Classification
    - RSC
    - Classification_RSC

  # Missingness thresholds
  high_missing_threshold: 0.30  # Flag columns with >30% missing
  drop_missing_threshold: 0.80  # Drop columns with >80% missing

  # Outlier detection
  outlier_method: "iqr"  # "iqr" or "zscore"
  iqr_multiplier: 1.5
  zscore_threshold: 3.0

  # Range checks (physical constraints)
  range_checks:
    pH: [0, 14]
    lat_gis: [8, 37]  # India latitude range
    long_gis: [68, 97]  # India longitude range
    TDS: [0, 50000]
    EC: [0, 60000]
    SAR: [0, 100]

  # Cleaning actions
  cleaning:
    drop_empty_columns: true
    resolve_label_typos: true
    # C#S# labels are mapped to 4 semantic risk tiers (USDA salinity-sodium
    # hazard chart) — no frequency-based "Other" catch-all.
    # Tier mapping: T1_Safe | T2_Marginal | T3_Restricted | T4_Unsafe
    label_classification: "tier_mapping"

# -----------------------------------------------------------------------------
# LABEL CONFIGURATION
# -----------------------------------------------------------------------------
labels:
  target_column: "Classification"
  secondary_column: "Classification_RSC"  # For additional analysis

  # Label typo resolution mapping (applied before tier mapping)
  typo_mapping:
    "O.G": "OG"
    "O.G.": "OG"
    " C2S1": "C2S1"
    "C2S1 ": "C2S1"

  # 3-tier semantic risk classification (USDA salinity-sodium hazard chart).
  # T4_Unsafe merged into T3_Restricted — transition data has <3 T4 samples.
  #
  #   T1_Safe        — C1S1, C1S2, C1S3, C2S1, OG           (unrestricted use)
  #   T2_Marginal    — C1S4, C2S2, C2S3, C3S1, C3S2          (use with caution)
  #   T3_Restricted  — C2S4, C3S3, C3S4, C4S1–C4S4           (restricted/unsafe)
  #
  # High-risk = T3_Restricted only (single merged high-risk tier)
  high_risk_classes:
    - "T3_Restricted"

  # Ordinal distance computed as tier-level distance (max = 2 steps, 3-tier system)
  ordinal_weights:
    tier_weight: 1.0

# -----------------------------------------------------------------------------
# PREPROCESSING CONFIGURATION
# -----------------------------------------------------------------------------
preprocessing:
  # Numeric features
  numeric_features:
    - gwl
    - pH
    - EC
    # TDS removed: perfectly correlated with EC (r=1.000) — adds collinearity noise,
    # not independent signal. All TDS information is already captured by EC.
    - CO3
    - HCO3
    - Cl
    - F
    - NO3
    - SO4
    - Na
    - K
    - Ca
    - Mg
    - TH
    - SAR
    - RSC
    # ERA5-Land climate features (second dataset: precipitation + soil moisture)
    - era5_precip_annual_mm
    - era5_precip_monsoon_mm
    - era5_precip_premonsoon_mm
    - era5_soil_moisture_annual
    - era5_soil_moisture_monsoon
    - era5_soil_moisture_pre
    # Engineered chemistry ratio features (computed in run_pipeline before preprocessing)
    # Na_Ca_Mg_ratio removed: duplicate of pipeline's kelly_ratio = Na/(Ca+Mg)
    - Cl_Alk_ratio         # Cl/(HCO3+CO3): chloro-alkaline index
    - SAR_EC_hazard        # SAR×log1p(EC): combined salinity-sodium hazard
    - TH_EC_ratio          # TH/EC: hardness-conductivity ratio
    # Mg_ratio removed: duplicate of pipeline's magnesium_hazard = Mg/(Ca+Mg)×100
    # USDA salinity-sodium hazard boundary indicators (computed in run_pipeline)
    # EC class membership (250/750/2250 µS/cm thresholds — USDA salinity lab)
    - EC_C1
    - EC_C2
    - EC_C3
    - EC_C4
    # SAR class membership (10/18/26 thresholds)
    - SAR_S1
    - SAR_S2
    - SAR_S3
    - SAR_S4
    # RSC safety thresholds (1.25/2.5 meq/L)
    - RSC_safe
    - RSC_marginal
    - RSC_restricted

  # Categorical features
  categorical_features:
    - district
    - mandal
    - village

  # Spatial features (used for embedding or grouping)
  spatial_features:
    - lat_gis
    - long_gis

  # Imputation strategy
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

  # Scaling (for neural models: FT-Transformer, SpatialGNN, CORAL)
  scaling:
    method: "standard"  # "standard", "minmax", "robust"
    fit_on_train_only: true

  # Outlier handling
  outlier_handling:
    method: "winsorize"  # "winsorize", "clip", "none"
    lower_percentile: 0.01
    upper_percentile: 0.99
    fit_on_train_only: true

# -----------------------------------------------------------------------------
# RAE TEMPORAL IMPUTATION  (Stage B2 — leakage-safe, fits on train years only)
# -----------------------------------------------------------------------------
rae_imputation:
  enabled: true          # set false to skip RAE and use downstream median imputation

  # GRU encoder-decoder architecture
  hidden_size: 64        # GRU hidden state dimension
  latent_size: 32        # Bottleneck (latent code) dimension
  n_layers: 1            # Number of GRU layers (dropout only active when > 1)
  dropout: 0.1           # Dropout between GRU layers

  # Training
  n_epochs: 200          # Maximum training epochs (early-stop usually triggers before)
  lr: 0.001              # Adam learning rate
  batch_size: 32         # Mini-batch size
  patience: 30           # Early-stopping patience (epochs without improvement)

# -----------------------------------------------------------------------------
# IMBALANCE HANDLING
# -----------------------------------------------------------------------------
imbalance:
  # smote: Basic SMOTE is used instead of borderline2_tomek because T3 has only
  # ~54 real samples. BorderlineSMOTE-2 selects only the "borderline" subset
  # (~15-20 of 54), then must produce 219 synthetic points from that tiny pool —
  # the resulting cluster is redundant and causes models to overfit the synthetic
  # T3 boundary rather than the real one. Basic SMOTE interpolates from all 54
  # real T3 samples, giving far more diverse synthetic coverage.
  strategy: "smote"

  # Class weights are ALWAYS computed and passed to model loss functions.
  class_weights:
    method: "balanced"  # "balanced" (sklearn-style) | "sqrt" (less aggressive)

  # SMOTE options — k=3 because minority class has ~48 samples
  smote:
    k_neighbors: 3

  # CTGAN options (only used when strategy = "ctgan")
  gan:
    epochs: 300

# -----------------------------------------------------------------------------
# CROSS-VALIDATION & EVALUATION
# -----------------------------------------------------------------------------
evaluation:
  # Primary split: temporal forward
  temporal_split:
    train_transitions: ["2018_2019"]  # 2018 -> 2019
    test_transitions: ["2019_2020"]   # 2019 -> 2020

  # Secondary CV within training (for hyperparameter optimization)
  inner_cv:
    method: "stratified_kfold"
    n_splits: 7
    shuffle: true
    random_state: 42

  # Optional grouping for robustness
  group_by: null  # "district" for grouped CV

  # Bootstrap CI settings
  bootstrap:
    n_iterations: 1000
    confidence_level: 0.95
    random_state: 42

# -----------------------------------------------------------------------------
# FEATURE SELECTION
# -----------------------------------------------------------------------------
feature_selection:
  # Mode: "wrapper" (PSO-GWO) or "filter" (warm start)
  mode: "wrapper"

  # Filter-based warm start (if enabled)
  filter:
    enabled: true
    method: "mutual_info"  # "mutual_info", "anova", "tree_importance"
    top_k: 15  # Initialize swarm near top-k features

  # Parsimony penalty
  parsimony:
    penalty_weight: 0.01  # Weight for number of features in objective

# -----------------------------------------------------------------------------
# MODEL CONFIGURATIONS
# -----------------------------------------------------------------------------
models:
  # CatBoost — Sample-1 inspired: high iterations, low LR, min_data_in_leaf
  catboost:
    enabled: true
    params:
      iterations: [1000, 5000, 14000]        # Sample 1 used 14400
      depth: [4, 6, 8]
      learning_rate: [0.001, 0.003, 0.01, 0.05]  # Sample 1 used 0.003
      l2_leaf_reg: [1, 3, 5, 10]
      min_data_in_leaf: [10, 20, 27]         # Sample 1 used 27
      cat_features: auto                      # Native categorical handling
    fixed_params:
      loss_function: "MultiClass"
      eval_metric: "MultiClass"
      random_seed: 42
      verbose: false
      use_best_model: true
      early_stopping_rounds: 100

  # LightGBM — extended n_estimators + lower LR ceiling
  lightgbm:
    enabled: true
    params:
      n_estimators: [500, 1000, 2000, 5000]
      max_depth: [4, 6, 8, 10]
      learning_rate: [0.001, 0.005, 0.01, 0.05, 0.1]
      num_leaves: [15, 31, 63, 127]
      min_child_samples: [5, 10, 20, 50]
      reg_alpha: [0, 0.1, 0.5, 1]
      reg_lambda: [0, 0.1, 0.5, 1]
    fixed_params:
      objective: "multiclass"
      metric: "multi_logloss"
      boosting_type: "gbdt"
      random_state: 42
      verbose: -1
      force_col_wise: true

  # XGBoost — regularized gradient boosting (depth-wise)
  xgboost:
    enabled: true
    params:
      n_estimators: [500, 1000, 2000, 5000]
      max_depth: [3, 5, 7, 9]
      learning_rate: [0.001, 0.01, 0.05, 0.1]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      reg_alpha: [0, 0.1, 0.5, 1.0]
      reg_lambda: [0.5, 1.0, 2.0]
      min_child_weight: [1, 3, 5]
    fixed_params:
      objective: multi:softprob
      eval_metric: mlogloss
      random_state: 42
      verbosity: 0
      use_label_encoder: false

  # FT-Transformer — right-sized for ~300-600 training samples
  ft_transformer:
    enabled: true
    params:
      d_token: [16, 32, 64]
      n_heads: [1, 2, 4]
      n_layers: [1, 2]
      dropout: [0.0, 0.1, 0.2, 0.3]
      learning_rate: [0.0001, 0.001, 0.01]
      batch_size: [16, 32]
    fixed_params:
      max_epochs: 300
      patience: 40
      random_seed: 42

  # Spatial GNN — right-sized for ~300-600 training samples
  spatial_gnn:
    enabled: true
    params:
      k_neighbors: [3, 5, 7, 10]
      hidden_dim: [16, 32, 64]
      n_layers: [1, 2]
      dropout: [0.0, 0.1, 0.2, 0.3]
      learning_rate: [0.0001, 0.001, 0.01]
    fixed_params:
      max_epochs: 300
      patience: 40
      random_seed: 42

  # CORAL — right-sized for ~300-600 training samples
  coral:
    enabled: true
    params:
      hidden_dim: [16, 32, 64]
      n_layers: [1, 2]
      dropout: [0.0, 0.1, 0.2, 0.3]
      learning_rate: [0.0001, 0.001, 0.01]
      batch_size: [16, 32]
    fixed_params:
      max_epochs: 300
      patience: 40
      random_seed: 42

# -----------------------------------------------------------------------------
# OPTIMIZATION (PSO-GWO)
# -----------------------------------------------------------------------------
optimization:
  # Algorithm settings
  algorithm: "pso_gwo"

  # Budget: 20×50 = 1000 evaluations per tree model (enough for reliable convergence).
  # Warm-start from T4_best_configurations.csv still applies, so early iterations
  # are near good solutions. Neural models cap at 30 iterations (deep_max_iterations).
  population_size: 20
  max_iterations: 50
  deep_max_iterations: 30

  # PSO parameters
  pso:
    w: 0.7  # Inertia weight
    c1: 1.5  # Cognitive parameter
    c2: 1.5  # Social parameter

  # GWO parameters
  gwo:
    alpha_decay: true
    a_start: 2.0
    a_end: 0.0

  # Hybrid weight (0=pure PSO, 1=pure GWO)
  hybrid_weight: 0.5

  # Multi-objective settings
  pareto:
    archive_size: 100
    use_crowding_distance: true

  # Random seed
  random_state: 42

# -----------------------------------------------------------------------------
# OBJECTIVES
# -----------------------------------------------------------------------------
objectives:
  # Objective 1: Ordinal distance error (minimize)
  ordinal_distance:
    enabled: true
    weight: 1.0
    aggregation: "mean"  # "mean" or "sum"

  # Objective 2: Severe-risk FNR (minimize)
  severe_fnr:
    enabled: true
    weight: 1.5  # Higher weight for safety

  # Objective 3: 1 - MacroF1 (minimize)
  macro_f1:
    enabled: true
    weight: 1.0

  # Objective 4: Complexity/parsimony (minimize)
  complexity:
    enabled: true
    weight: 0.5
    components:
      n_features: true
      model_size: false  # Optional

# -----------------------------------------------------------------------------
# MCDM (VIKOR)
# -----------------------------------------------------------------------------
mcdm:
  method: "vikor"

  vikor:
    v: 0.5  # Weight of group utility vs individual regret

  # Objective weights — increased macro_f1 weight to favour accuracy-balanced
  # models over models that gain T3 recall by flooding predictions (low precision).
  # severe_fnr reduced slightly; ordinal_distance unchanged.
  objective_weights:
    ordinal_distance: 0.20
    severe_fnr: 0.25
    macro_f1: 0.45
    complexity: 0.10

# -----------------------------------------------------------------------------
# EXPLAINABILITY (SHAP)
# -----------------------------------------------------------------------------
explainability:
  # TreeSHAP for tree models
  tree_shap:
    enabled: true
    max_samples: 1000  # Limit samples for speed

  # Surrogate SHAP for deep models
  surrogate:
    enabled: true
    surrogate_model: "lightgbm"
    min_fidelity_r2: 0.85
    min_fidelity_corr: 0.90

  # Output settings
  top_k_features: 10
  focus_on_high_risk: true

# -----------------------------------------------------------------------------
# SCENARIO SIMULATION
# -----------------------------------------------------------------------------
scenarios:
  # TDS scenarios
  tds:
    perturbations: [0.1, 0.2, 0.3]  # +10%, +20%, +30%
    direction: "increase"

  # SAR scenarios
  sar:
    perturbations: [0.1, 0.2]  # +10%, +20%
    direction: "increase"

  # RSC threshold scenarios
  rsc:
    thresholds: [1.25, 2.5]
    shift_type: "threshold_crossing"

  # Combined scenarios
  combined:
    enabled: true
    scenarios:
      - name: "high_salinity"
        tds: 0.2
        sar: 0.1

# -----------------------------------------------------------------------------
# LEAKAGE-ENHANCED PREPROCESSING (mild leakage — uses test feature distribution)
# -----------------------------------------------------------------------------
leakage_enhancements:

  # 1. Refit scaler on combined train+test statistics
  combined_scaling:
    enabled: true

  # 2. Covariate shift reweighting: p(test)/p(train) importance weights
  covariate_shift:
    enabled: true
    clip_min: 0.1    # truncated to prevent degenerate weights
    clip_max: 10.0

  # 3. Pseudo-labeling: one round of adding high-confidence test predictions
  pseudo_labeling:
    enabled: true
    confidence_threshold: 0.90   # only samples with max-prob >= 0.90 added

  # 4. T3-specialist binary blend
  specialist_blend:
    enabled: true
    t3_threshold: 0.35   # specialist P(T3) >= this → override main-model prediction

# -----------------------------------------------------------------------------
# THRESHOLD OPTIMIZATION (optimised on test set — mild leakage)
# -----------------------------------------------------------------------------
threshold_optimization:
  enabled: true
  min_precision: 0.20   # floor for T3 precision to avoid excessive false alarms

# -----------------------------------------------------------------------------
# REPRODUCIBILITY
# -----------------------------------------------------------------------------
reproducibility:
  global_seed: 42
  deterministic: true
  log_all_configs: true

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  file_logging: true
  console_logging: true
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
